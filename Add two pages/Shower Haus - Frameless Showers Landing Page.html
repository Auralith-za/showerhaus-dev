    // would push the parser into quirks mode. DOMParser always emits a <head>

solid #E7E3DA;border-radius:2px;overflow:hidden;\"><div style=\"height:150px;background:repeating-linear-gradient(90deg,rgba(176,182,184,0.9),rgba(176,182,184,0.9) 6px,rgba(206,212,214,0.9) 6px,rgba(206,212,214,0.9) 12px);\"><\u002Fdiv><div style=\"padding:22px;\"><h3 style=\"font-size:16px;color:#17233D;margin-bottom:6px;font-weight:600;\">Grey reeded<\u002Fh3><p style=\"font-size:13.5px;\">The same fluted texture in a soft grey tone.<\u002Fp><\u002Fdiv><\u002Fdiv>\n            <div style=\"border:1px solid #E7E3DA;border-radius:2px;overflow:hidden;\"><div style=\"height:150px;background:linear-gradient(135deg,rgba(228,230,229,0.95),rgba(210,214,213,0.95));\"><\u002Fdiv><div style=\"padding:22px;\"><h3 style=\"font-size:16px;color:#17233D;margin-bottom:6px;font-weight:600;\">Satinato<\u002Fh3><p style=\"font-size:13.5px;\">A smooth, matt, acid-etched finish for full privacy.<\u002Fp><\u002Fdiv><\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-size:15px;color:#5C6572;text-align:center;margin-top:36px;\">Thickness: <strong style=\"color:#17233D;\">6, 8, or 10 mm<\u002Fstrong> toughened safety glass, to suit the design.<\u002Fp>\n        <\u002Fsection>\n\n        <!-- 7. INSTAGRAM -->\n        <section style=\"background:#F1F0ED;\">\n          <div style=\"max-width:1280px;margin:0 auto;padding:100px 48px;\">\n            <div style=\"text-align:center;max-width:640px;margin:0 auto 44px;\">\n              <div style=\"font-size:12px;letter-spacing:0.3em;color:#93A0B2;font-weight:500;margin-bottom:18px;text-transform:uppercase;\">@showerhaussa<\u002Fdiv>\n              <h2 style=\"font-size:38px;color:#17233D;font-weight:700;margin-bottom:16px;\">See more on Instagram.<\u002Fh2>\n              <p style=\"font-size:16px;\">Fresh installs and work in progress from our team.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(6,1fr);gap:14px;\">\n              <div style=\"aspect-ratio:1/1;background:repeating gin:0 auto 60px;\">\n            <div style=\"font-size:12px;letter-spacing:0.3em;color:#93A0B2;font-weight:500;margin-bottom:18px;text-transform:uppercase;\">Made to Measure<\u002Fdiv>\n            <h2 style=\"font-size:38px;color:#17233D;font-weight:700;margin-bottom:20px;\">From your bathroom to a finished frameless shower.<\u002Fh2>\n            <div style=\"width:70px;height:1px;background:#C6CBCE;margin:0 auto;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:32px;\">\n            <div><div style=\"width:52px;height:52px;border-radius:50%;background:#17233D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;margin-bottom:18px;\">1<\u002Fdiv><h3 style=\"font-size:18px;color:#17233D;margin-bottom:10px;font-weight:600;\">Design<\u002Fh3><p style=\"font-size:14.5px;\">Tell us your style, configuration, dimensions and hardware in the configurator.<\u002Fp><\u002Fdiv>\n            <div><div style=\"width:52px;height:52px;border-radius:50%;background:#17233D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;margin-bottom:18px;\">2<\u002Fdiv><h3 style=\"font-size:18px;color:#17233D;margin-bottom:10px;font-weight:600;\">Measure<\u002Fh3><p style=\"font-size:14.5px;\">A specialist measures on site — free within 50 km, usually within 2–3 working days.<\u002Fp><\u002Fdiv>\n            <div><div style=\"width:52px;height:52px;border-radius:50%;background:#17233D;color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;margin-bottom:18px;\">3<\u002Fdiv><h3 style=\"font-size:18px;color:#17233D;margin-bottom:10px;font-weight:600;\">Make<\u002Fh3><p style=\"font-size:14.5px;\">Your enclosure is manufactured to your exact measurements — about 10–12 working days from deposit.<\u002Fp><\u002Fdiv>\n            <div><div style=\"width: 52px; height: 52px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600; margin-bottom: 18px; background-color: #17233D\">4<\u002Fdiv><h3 style=\"font-size:18px;color:#17233D;margin-bottom:10px;font-weight:600;\">Install<\u002Fh3><p style=\"font-size:14.5px;\">Fitted properly, sealed and finished, and backed by our three-month workmanship guarantee.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap;margin-top:52px;padding-top:36px;border-top:1px solid #EDE9DF;\">\n            <div style=\"display:flex;align-items:center;gap:28px;flex-wrap:wrap;\">\n              <span style=\"font-size:14px;color:#5C6572;\">Fully accredited and insured — members of SAGGA, SASEMA and the MBA.<\u002Fspan>\n              <div style=\"display:flex;gap:14px;\"><div style=\"width:96px;height:40px;background:#fff;border:1px dashed #CFC8B8;border-radius:4px;\"><\u002Fdiv><div style=\"width:96px;height:40px;background:#fff;border:1px dashed #CFC8B8;border-radius:4px;\"><\u002Fdiv><div style=\"width:96px;height:40px;background:#fff;border:1px dashed #CFC8B8;border-radius:4px;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <a href=\"#\" style=\"font-size:13px;letter-spacing:0.14em;color:#1C4E86;text-transform:uppercase;text-decoration:underline;text-underline-offset:4px;\">See the full process →<\u002Fa>\n          <\u002Fdiv>\n          <div style=\"text-align:center;margin-top:40px;\">\n            <a href=\"#\" style=\"display:inline-block;background:#17233D;color:#fff;font-size:13px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;padding:17px 34px;border-radius:2px;text-decoration:none;\">Design Your Shower →<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 9. SOCIAL PROOF -->\n        <section style=\"background:#F1F0ED;\">\n          <div style=\"max-width:1180px;margin:0 auto;padding:100px 48px;\">\n            <div style=\"text-align:center;max-width:640px;margin:0 auto 52px;\">\n              <div style=\"font-size:12px;letter-spacing:0.3em;color:#93A0B2;font-weight:500;margin-bottom:18px;text-transform:uppercase;\">Customer Stories<\u002Fdiv>\n              <h2 style=\"font-size:38px;color:#17233D;font-weight:700;margin-bottom:20px;\">Trusted across KwaZulu-Natal.<\u002Fh2>\n              <div style=\"width:70px;height:1px;background:#C6CBCE;margin:0 auto;\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:24px;\">\n              <div style=\"background:#fff;border:1px solid #E7E3DA;border-radius:2px;padding:34px;\"><div style=\"color:#1C4E86;font-size:15px;letter-spacing:0.1em;margin-bottom:16px;\">★★★★★<\u002Fdiv><p style=\"font-size:15px;margin-bottom:20px;\">\"I asked Shower Haus for a frameless shower door. Within a day, someone came out to measure; I had a quote shortly after, and my glass was installed within a week. The team was highly professional and even wore shoe covers to keep the place clean. I'd highly recommend them.\"<\u002Fp><div style=\"font-size:13px;color:#17233D;font-weight:600;letter-spacing:0.06em;\">— Verified Google review, Durban<\u002Fdiv><\u002Fdiv>\n              <div style=\"background:#fff;border:1px solid #E7E3DA;border-radius:2px;padding:34px;\"><div style=\"color:#1C4E86;font-size:15px;letter-spacing:0.1em;margin-bottom:16px;\">★★★★★<\u002Fdiv><p style=\"font-size:15px;margin-bottom:20px;\">\"I've used Shower Haus across three home renovations over the past 12 years. Every time the service has been fantastic — from technical recommendations through measuring, manufacture and installation. A professional, efficient company, and fantastic value for superb quality.\"<\u002Fp><div style=\"font-size:13px;color:#17233D;font-weight:600;letter-spacing:0.06em;\">— Ian Williams, Umhlanga<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <p style=\"text-align:center;font-size:15px;color:#17233D;margin-top:32px;letter-spacing:0.04em;\"><span style=\"color:#1C4E86;letter-spacing:0.1em;\">★★★★★<\u002Fspan>&nbsp; 4.3 on Google · [review count]<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 10. FAQ -->\n        <section style=\"max-width:920px;margin:0 auto;padding:100px 48px;\">\n          <div style=\"text-align:center;margin-bottom:52px;\">\n            <div style=\"font-size:12px;letter-spacing:0.3em;color:#93A0B2;font-weight:500;margin-bottom:18px;text-transform:uppercase;\">Questions<\u002Fdiv>\n            <h2 style=\"font-size:38px;color:#17233D;font-weight:700;margin-bottom:20px;\">Frameless shower questions, answered.<\u002Fh2>\n            <div style=\"width:70px;height:1px;background:#C6CBCE;margin:0 auto;\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-top:1px solid #E3DED2;\">\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">What is a frameless shower?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">A frameless shower uses toughened safety glass held by minimal hardware — slim hinges and clamps — rather than a full aluminium frame. The result is a clean, open look that makes the most of light and space.<\u002Fp><\u002Fdetails>\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">Frameless, semi-frameless or framed — what's the difference?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">Frameless uses thick 6–10mm glass with minimal hardware. Semi-frameless keeps framing on some edges for support with open glass elsewhere. Framed has a full profile around the panels and door. <a href=\"#\" style=\"color: rgb(28, 78, 134); text-decoration: underline; text-underline-offset: 3px;\">Compare on our Custom-made Showers page →<\u002Fa><\u002Fp><\u002Fdetails>\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">Do frameless showers leak?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">Installed correctly, no. Accurate measurement, the right seals and a level fit keep water where it should be — which is why every frameless shower we fit is individually measured. Our installations carry a three-month workmanship guarantee against leaks.<\u002Fp><\u002Fdetails>\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">Are frameless showers more expensive?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">Frameless showers are more expensive than semi-frameless, but they are actually cheaper than framed showers as there are no metal frames around the glass.<\u002Fp><\u002Fdetails>\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">How thick is the glass? Is it safe?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">Toughened safety glass, usually 6, 8, or 10mm for a frameless shower depending on the size of the panels.<\u002Fp><\u002Fdetails>\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">Are frameless showers hard to clean?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">The opposite — with fewer frames and tracks, there's far less to trap water and grime, so routine cleaning keeps the glass clear.<\u002Fp><\u002Fdetails>\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">Can you do sandblasted or etched glass designs?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">We don't sandblast in-house, but we can arrange it — we work with a trusted specialist nearby and can send your glass out for sandblasting.<\u002Fp><\u002Fdetails>\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">Do frameless showers add value to my home?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">A well-made frameless shower is a strong selling point in a modern bathroom, thanks to the clean, high-quality finish.<\u002Fp><\u002Fdetails>\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">How long does it take?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">About 10–12 working days from deposit to installation, depending on the time of year, workload at the glass factories, and workload across our installation teams.<\u002Fp><\u002Fdetails>\n            <details><summary style=\"display:flex;justify-content:space-between;align-items:center;gap:20px;padding:24px 0;border-bottom:1px solid #E3DED2;\"><span style=\"font-size:17px;color:#17233D;font-weight:500;\">Do you install across KZN?<\u002Fspan><span class=\"sh-faq-plus\" style=\"font-size:22px;color:#1C4E86;transition:transform .2s;line-height:1;\">+<\u002Fspan><\u002Fsummary><p style=\"font-size:15px;padding:4px 0 24px;border-bottom:1px solid #E3DED2;\">Yes — across Durban and KwaZulu-Natal. On-site consultations within roughly 50 km of our Springfield showroom are free; a call-out fee applies further afield. Long-distance installations also attract a surcharge which is individually calculated depending on operational impact the job will have.<\u002Fp><\u002Fdetails>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- 11. FINAL CTA -->\n        <section style=\"background:#17233D;color:#DDE2EA;\">\n          <div style=\"max-width:1180px;margin:0 auto;padding:110px 48px;text-align:center;\">\n            <h2 style=\"font-size:48px;color:#fff;margin-bottom:18px;font-weight:700;\">Ready for the right fit?<\u002Fh2>\n            <p style=\"font-size:18px;color:#C4CBD7;max-width:560px;margin:0 auto 38px;\">Design your frameless shower in a few steps and our team will prepare a tailored quote.<\u002Fp>\n            <a href=\"#\" style=\"display:inline-block;background:#fff;color:#17233D;font-size:14px;font-weight:600;letter-spacing:0.2em;text-transform:uppercase;padding:20px 42px;border-radius:2px;text-decoration:none;\">Design Your Shower →<\u002Fa>\n            <p style=\"font-size:14px;color:#93A0B2;margin-top:26px;letter-spacing:0.03em;\">Book a home measure · Call 031 312 9095 · Visit our showroom<\u002Fp>\n            <div style=\"margin-top:56px;padding-top:32px;border-top:1px solid rgba(255,255,255,0.14);font-size:15px;letter-spacing:0.16em;color:#C4CBD7;\">SHOWER HAUS — THE RIGHT FIT.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- FOOTER -->\n        <footer style=\"background:#FFFFFF;border-top:1px solid #EEEAE0;\">\n          <div style=\"max-width:1180px;margin:0 auto;padding:70px 48px;display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:48px;\">\n            <div>\n              <img src=\"cf505635-a661-47c5-a338-7eea85d90c72\" alt=\"Shower Haus\" style=\"height:64px;width:auto;display:block;margin-bottom:26px;\">\n              <p style=\"font-size:14px;color:#5C6572;line-height:1.7;\">90A Intersite Avenue<br>Umgeni Business Park<br>Springfield 4091<br>South Africa<\u002Fp>\n              <p style=\"font-size:14px;color:#17233D;margin-top:20px;\">031 312 9095<\u002Fp>\n              <p style=\"font-size:14px;color:#1C4E86;margin-top:6px;\"><a href=\"#\" style=\"color:#1C4E86;text-decoration:underline;text-underline-offset:3px;\">hello@showerhaus.co.za<\u002Fa><\u002Fp>\n            <\u002F
